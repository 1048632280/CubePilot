plugins {
    id 'fabric-loom' version '1.7.4'
}

base {
    archivesName = 'cubepilot-fabric-1.20.1'
}

version = rootProject.version

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    implementation project(':core')
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

loom {
    mods {
        cubepilot {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common-minecraft/src/main/java'))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

jar {
    from(project(':core').sourceSets.main.output)
}
