pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'CubePilot'

def platformProjects = ['fabric-1.20.1', 'forge-1.20.1', 'fabric-1.21.1', 'neoforge-1.21.1']
def targetProject = gradle.startParameter.projectProperties.get('targetProject')

include 'core'
if (targetProject == null) {
    include platformProjects
} else if (targetProject != 'core' && platformProjects.contains(targetProject)) {
    include targetProject
} else if (targetProject != 'core') {
    throw new GradleException("Unknown targetProject: ${targetProject}")
}
